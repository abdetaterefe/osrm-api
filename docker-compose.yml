services:
  osrm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osrm-bicycle-service
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    volumes:
      - ./osrm-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
