name: Prepare and Release Map Data

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/prepare-map.yml'

permissions:
  contents: write

jobs:
  build-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Ethiopia OSM Data
        run: |
          echo "Downloading Ethiopia OSM data in GitHub Cloud from OSM France mirror..."
          wget -q --show-progress -O ethiopia-latest.osm.pbf https://download.openstreetmap.fr/extracts/africa/ethiopia-latest.osm.pbf

      - name: Process Map with OSRM (Bicycle Profile)
        run: |
          mkdir -p osrm-data
          cp ethiopia-latest.osm.pbf osrm-data/ethiopia-bicycle.osm.pbf
          docker run --rm \
            -v $(pwd)/osrm-data:/data \
            -v $(pwd)/profiles:/profiles \
            ghcr.io/project-osrm/osrm-backend:v5.27.1 bash -c "
              osrm-extract -p /profiles/bicycle.lua /data/ethiopia-bicycle.osm.pbf && \
              osrm-partition /data/ethiopia-bicycle.osrm && \
              osrm-customize /data/ethiopia-bicycle.osrm && \
              rm -f /data/*.osm.pbf || true
            "
          rm -f ethiopia-latest.osm.pbf
          tar -czf ethiopia-bicycle-osrm.tar.gz -C osrm-data .

      - name: Publish Map to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0-data --yes 2>/dev/null || true
          git tag -d v1.0-data 2>/dev/null || true
          git push --delete origin v1.0-data 2>/dev/null || true
          gh release create v1.0-data ethiopia-bicycle-osrm.tar.gz \
            --title "Ethiopia OSRM Bicycle Map Data" \
            --notes "Pre-compiled OSRM MLD graph for bicycle routing in Ethiopia. Auto-generated by GitHub Actions in the cloud."
