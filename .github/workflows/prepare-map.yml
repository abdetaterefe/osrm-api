name: Prepare and Release Valhalla Map Data

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/prepare-map.yml'

permissions:
  contents: write

jobs:
  build-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Ethiopia OSM Data
        run: |
          echo "Downloading Ethiopia OSM data in GitHub Cloud from OSM France mirror..."
          mkdir -p custom_files
          wget -q --show-progress -O custom_files/ethiopia-latest.osm.pbf https://download.openstreetmap.fr/extracts/africa/ethiopia-latest.osm.pbf

      - name: Process Map with Valhalla (All Profiles)
        run: |
          echo "Building Valhalla hierarchical routing tiles..."
          docker run --rm \
            -v $(pwd)/custom_files:/custom_files \
            -e build_tar=True \
            -e serve_tiles=False \
            -e force_rebuild=True \
            ghcr.io/gis-ops/docker-valhalla/valhalla:latest build_tiles
          
          # Remove raw PBF and uncompressed tiles to save archive space
          rm -f custom_files/*.pbf
          rm -rf custom_files/valhalla/tiles custom_files/tiles
          
          sudo chmod -R 777 custom_files
          tar -czf ethiopia-valhalla-tiles.tar.gz -C custom_files .
          echo "=== Valhalla tiles archive created successfully, size: $(du -h ethiopia-valhalla-tiles.tar.gz | cut -f1) ==="

      - name: Publish Map to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v2.0-valhalla-data --yes 2>/dev/null || true
          git tag -d v2.0-valhalla-data 2>/dev/null || true
          git push --delete origin v2.0-valhalla-data 2>/dev/null || true
          gh release create v2.0-valhalla-data ethiopia-valhalla-tiles.tar.gz \
            --title "Ethiopia Valhalla Routing Tiles (All Profiles)" \
            --notes "Pre-compiled Valhalla hierarchical routing tiles for Ethiopia supporting Car, Motorcycle, Bicycle, and Pedestrian routing simultaneously. Auto-generated by GitHub Actions in the cloud."
